name: Nice if example
on:
  push:
    branches:
      - main
      - develop
      - feature/**
jobs:
  quality_check:
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Perform code quality
        run:  echo "Performing code quality check on feature branch"

  dev-deploy:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Devploy
        run: echo "Deploying the code to development environment"
    
  prod-deploy:
    if: github.ref_name == 'main' && github.event_name == 'push'  
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Prod
        run: echo "Deploying the code to production environment"
  success-notify:
    needs: [quality_check, dev-deploy, prod-deploy]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Success
        run: echo "Success email sent to the team"

  failure-notify:
      needs: [quality_check, dev-deploy, prod-deploy]
      if: failure()
      runs-on: ubuntu-latest
      steps:
        - name: Notify Failure
          run: echo "Failure email sent to the team"

